# https://github.com/firebase/firebase-tools

name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - main
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Dependencies
        run: npm install

      # Generar el archivo environment.ts a partir del Secreto de GitHub
      - name: Create environment file
        run: |
          mkdir -p src/
          echo "${{ secrets.ENVIRONMENT }}" > src/environments.ts

      # Construir el proyecto de Angular
      - run: npm run build --configuration=production --aot
      
      # Desplegar a Firebase
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_TIENDA_ONLINE_771DA }}
          channelId: live
          projectId: tienda-online-771da
