name: Deploy to Firebase Hosting on PR
on: pull_request
permissions:
  checks: write
  contents: read
  pull-requests: write
jobs:
  build_and_preview:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Generar el archivo environment.ts a partir del Secreto de GitHub
      - name: Create environment file
        run: |
          mkdir -p src/
          echo "${{ secrets.ENVIRONMENT }}" > src/environments.ts
      
      # Construir el proyecto de Angular
      - run: npx ng build --configuration=production --aot
      
      # Desplegar a Firebase
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_TIENDA_ONLINE_771DA }}
          projectId: tienda-online-771da
