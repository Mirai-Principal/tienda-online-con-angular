<div class="container d-flex flex-column align-items-center justify-content-center mt-5 pt-3">
    <div class="card p-4 p-md-5 shadow-lg border-0 rounded-4" style="width: 100%; max-width: 420px;">
        <div class="text-center mb-4">
            <div class="bg-primary text-white rounded-circle d-inline-flex align-items-center justify-content-center mb-3 shadow-sm"
                style="width: 64px; height: 64px;">
                <i class="bi bi-person-fill" style="font-size: 32px; line-height: 1;"></i>
            </div>
            <h2 class="fw-bold mb-1 text-dark">¡Bienvenido!</h2>
            <p class="text-muted">Inicia sesión en tu cuenta</p>
        </div>
        <div class="card-body p-0">
            <form #loginForm="ngForm" (ngSubmit)="login(loginForm)">
                <div class="input-group mb-3">
                    <span class="input-group-text bg-secondary" id="email-addon"><i class="bi bi-envelope"></i></span>
                    <div class="form-floating flex-grow-1">
                        <input type="email" class="form-control rounded-end-3" id="email" name="email" required ngModel
                            placeholder="name@example.com" aria-describedby="email-addon"
                            style="border-left: 0; box-shadow: none;">
                        <label for="email" class="text-muted">Correo Electrónico</label>
                    </div>
                </div>
                <div class="input-group mb-4">
                    <span class="input-group-text bg-secondary" id="password-addon"><i class="bi bi-lock"></i></span>
                    <div class="form-floating flex-grow-1">
                        <input type="password" class="form-control rounded-end-3" id="password" name="password" required
                            ngModel placeholder="Contraseña" aria-describedby="password-addon"
                            style="border-left: 0; box-shadow: none;">
                        <label for="password" class="text-muted">Contraseña</label>
                    </div>
                </div>
                <button type="submit"
                    class="btn btn-primary btn-lg w-100 rounded-3 fw-bold shadow-sm d-flex justify-content-center align-items-center gap-2"
                    [disabled]="loginForm.invalid">
                    <span>Iniciar Sesión</span>
                    <i class="bi bi-box-arrow-in-right" style="font-size: 20px; line-height: 1;"></i>
                </button>
            </form>
        </div>
    </div>
</div>
